version: "3.9"


services:
  opencanal:
    build: .
    container_name: opencanal
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ~/.cdsapirc:/root/.cdsapirc:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
